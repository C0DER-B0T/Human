<g onclick="sendPrompt('How does the touch-to-emotion mapping work in detail?')" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
