  <text x="340" y="520" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">head + slow stroke → happiness +0.3, calm +0.2</text>
  <text x="340" y="538" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">chest + hard fast tap → anxiety +0.5, stress +0.3</text>
  <text x="340" y="556" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">hand + hold → relaxation +0.4</text>
</g>
