  <text x="340" y="184" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180, 178, 169);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Returns: mesh name (head / chest / hand / arm)</text>
</g>
