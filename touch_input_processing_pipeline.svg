  <rect x="130" y="604" width="420" height="68" rx="8" stroke-width="0.5" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
